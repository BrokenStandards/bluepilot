# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: BPModelDecelGate
    widget: toggle
    title: Model Decel Gate (E2E Brakes, ACC Accelerates)
    description: In Experimental Mode, the driving model may only slow the car (early braking for
      lights, hazards and stops); ACC owns acceleration and cruise, so the model can no longer hold
      the car below the set speed or speed limit. Takes precedence over Dynamic Experimental Control.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: BPModelDecelGateAccel
    widget: option
    title: Decel Gate Engage Threshold
    description: Model deceleration request (m/s²) that hands braking authority to the model.
      Closer to 0.00 engages on the gentlest slowdowns (curves, crests, brake lights); more
      negative requires harder model braking. Model dependent.
    min: -5.0
    max: 0.0
    step: 0.01
    unit:
      metric: m/s²
      imperial: m/s²
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
    - type: param
      key: BPModelDecelGate
      equals: true
  - key: BPModelDecelGateEndV
    widget: option
    title: Decel Gate Plan-End Margin
    description: How far the model's 10-second plan-end speed must fall below the current speed
      (m/s, negative delta) to hand braking authority to the model early. Closer to 0.00 is more
      sensitive; the default -2.00 sits above ordinary cruise plan sag.
    min: -10.0
    max: 0.0
    step: 0.1
    unit:
      metric: m/s
      imperial: m/s
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
    - type: param
      key: BPModelDecelGate
      equals: true
  - key: BPLimiterWindow
    widget: option
    title: Longitudinal Controller Icons Window
    description: Rolling window (seconds) over which the bottom-center controller icons rank
      and color longitudinal controllers by their accel/decel contribution.
    min: 0.0
    max: 5.0
    step: 0.1
    unit:
      metric: s
      imperial: s
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: BPLongitudinalTargetHUD
      equals: true
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
  - key: AlphaLongIcbmOffset
    widget: option
    title: Alpha Long ICBM Set Speed Margin
    description: How far above the desired speed ICBM keeps the cluster set speed when openpilot
      longitudinal is active, so the vehicle's own cruise module never limits acceleration near
      the target. Vehicle dependent.
    min: 1
    max: 15
    step: 1
    unit:
      metric: km/h
      imperial: mph
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: IntelligentCruiseButtonManagement
      equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  # BluePilot: curve speed preset for map curve control; the Python controller owns the preset
  # table, the UI only stores the selected index
  - key: CurveSpeedProfile
    widget: multiple_button
    title: Curve Speed
    description: Controls how early and how gently the car slows for mapped curves. Comfort slows
      earliest and most gently, Sport slows latest and carries the most speed through the curve.
    options:
    - value: 0
      label: Comfort
    - value: 1
      label: Normal
    - value: 2
      label: Sport
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
- id: map_matching
  # BluePilot: mapd_bp road matching; no longitudinal/ICBM dependency, so it sits
  # outside the capability-gated smart_cruise section
  title: Map Matching
  description: ''
  items:
  - key: VisualRoutingAssist
    widget: toggle
    title: Visual Routing Assistance
    description: Uses the car's actual driven path in addition to GPS to match the road on ramps
      and forks sooner.
